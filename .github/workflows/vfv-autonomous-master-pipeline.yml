name: VFV Autonomous Master Pipeline

on:
  schedule:
    # Daily autonomous hygiene, IP oracle synthesis & readiness audit at 08:15 UTC
    - cron: '15 8 * * *'
  workflow_dispatch:
    inputs:
      target_repos:
        description: 'Comma-separated dextervann1-rgb repos (or "core6" or "all-owned")'
        required: true
        default: 'core6'
        type: string
      enable_autonomy_tasks:
        description: 'Run bloat/dup scan, vuln fixes, IP compare/hybrid oracle, and Android/game scaffolds'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      open_cleanup_pr:
        description: 'Open an agent/* PR with safe hygiene/vuln/scaffold patches on current repo'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      ip_pair:
        description: 'Two IPs to compare & fuse via Oracle (e.g., "MuSe-Transfer|Dime10-Find-Your-Dime")'
        required: true
        default: 'MuSe-Transfer|Dime10-Find-Your-Dime'
        type: string
      run_sepolia_check:
        description: 'Run Base Sepolia (84532) pre-check before any Base Mainnet action'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      deploy_base_mainnet:
        description: 'Gated Base Mainnet (8453) contract deploy & live RPC/Basescan verify (requires approval)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      mainnet_toolchain:
        description: 'Live deployment runner when deploy_base_mainnet is true (foundry, hardhat, or custom-cmd)'
        required: true
        default: 'foundry'
        type: choice
        options:
          - foundry
          - hardhat
          - custom-cmd
      confirm_mainnet_phrase:
        description: 'Type DEPLOY-BASE-MAINNET when deploy_base_mainnet is true'
        required: false
        default: ''
        type: string

permissions:
  contents: read


concurrency:
  group: vfv-autonomous-master-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autonomous-portfolio-and-ip-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 20
    outputs:
      sepolia_verified: ${{ steps.master_engine.outputs.sepolia_verified }}
      hitl_required: ${{ steps.master_engine.outputs.hitl_required }}

    steps:
      - name: Checkout primary repository without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js and Python environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run full-portfolio audit, bloat/dup/vuln scan, IP compare/oracle & Android/game builder
        id: master_engine
        env:
          GH_TOKEN: ${{ secrets.CORE6_GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}
          TARGET_REPOS: ${{ inputs.target_repos || 'core6' }}
          ENABLE_AUTONOMY: ${{ inputs.enable_autonomy_tasks || 'true' }}
          IP_PAIR: ${{ inputs.ip_pair || 'MuSe-Transfer|Dime10-Find-Your-Dime' }}
          RUN_SEPOLIA: ${{ inputs.run_sepolia_check || 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::CORE6_GH_TOKEN is required to inspect all Core 6 repositories, including private repositories."
            exit 1
          fi
          mkdir -p autonomous-artifacts/scaffolds/android-game autonomous-artifacts/contracts

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          now_utc = datetime.now(timezone.utc)
          audit_date = now_utc.strftime("%Y-%m-%d")
          run_num = os.environ.get("GITHUB_RUN_NUMBER", "local")
          sha = os.environ.get("GITHUB_SHA", "local")
          host_repo = os.environ.get("GITHUB_REPOSITORY", "dextervann1-rgb/vfv-autonomous-agentic-pipeline")
          token = os.environ.get("GH_TOKEN", "")
          target_spec = os.environ.get("TARGET_REPOS", "core6").strip()
          enable_autonomy = os.environ.get("ENABLE_AUTONOMY", "true").lower() == "true"
          ip_pair_raw = os.environ.get("IP_PAIR", "MuSe-Transfer|Dime10-Find-Your-Dime")
          run_sepolia = os.environ.get("RUN_SEPOLIA", "true").lower() == "true"
          sepolia_rpc = os.environ.get("BASE_SEPOLIA_RPC_URL", "https://sepolia.base.org")

          core6 = [
              "vfv-autonomous-agentic-pipeline",
              "vanndiamond-flash-foundry",
              "og8oh-muse-hybrid-superagent-v3",
              "omega-grand-scheme",
              "8-Leaps-of-Faith_space",
              "maze-miner-race-game",
          ]

          def gh_json(path: str):
              if not token:
                  return None
              res = subprocess.run(
                  ["gh", "api", path],
                  env={**os.environ, "GH_TOKEN": token},
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if res.returncode != 0:
                  print(f"GitHub API request failed for {path}: {res.stderr.strip()}", file=sys.stderr)
                  return None
              clean = re.sub(r"\x1b\[[0-9;]*m", "", res.stdout or "")
              try:
                  return json.loads(clean or "null")
              except json.JSONDecodeError as exc:
                  raise RuntimeError(f"GitHub API returned invalid JSON for {path}: {exc}") from exc

          discovered = []
          if target_spec.lower() == "all-owned":
              all_r = gh_json("/user/repos?affiliation=owner&per_page=100") or []
              discovered = [r["name"] for r in all_r if r.get("owner", {}).get("login") == "dextervann1-rgb"]
          elif target_spec.lower() == "core6":
              discovered = core6
          else:
              discovered = [x.strip() for x in target_spec.split(",") if x.strip()]

          if not discovered:
              discovered = core6

          repo_inventory = []
          for rname in discovered:
              meta = gh_json(f"/repos/dextervann1-rgb/{rname}") or {}
              if not meta:
                  raise RuntimeError(f"Unable to read repository metadata for {rname}; check CORE6_GH_TOKEN scope.")
              default_br = meta.get("default_branch")
              if not default_br:
                  raise RuntimeError(f"Repository {rname} has no default branch.")
              prot = gh_json(f"/repos/dextervann1-rgb/{rname}/branches/{default_br}/protection")
              envs_obj = gh_json(f"/repos/dextervann1-rgb/{rname}/environments") or {}
              env_names = [e.get("name") for e in (envs_obj.get("environments") or [])]
              runs_obj = gh_json(f"/repos/dextervann1-rgb/{rname}/actions/runs?branch={default_br}&per_page=1") or {}
              latest_runs = runs_obj.get("workflow_runs") or []
              latest_status = (
                  f"{latest_runs[0].get('status')}/{latest_runs[0].get('conclusion')}"
                  if latest_runs else "none/visible"
              )
              repo_inventory.append({
                  "repo": rname,
                  "private": bool(meta.get("private", rname in {"vanndiamond-flash-foundry", "8-Leaps-of-Faith_space"})),
                  "default_branch": default_br,
                  "branch_protected": bool(prot),
                  "has_sepolia_env": "base-sepolia" in env_names,
                  "has_mainnet_env": "base-mainnet" in env_names,
                  "latest_run": latest_status,
              })

          root = Path(".")
          skip_dirs = {".git", "node_modules", "dist", "build", ".next", "target", "vendor", "autonomous-artifacts"}
          code_exts = {".js", ".mjs", ".cjs", ".ts", ".tsx", ".sol", ".py", ".kt"}
          dup_hashes = defaultdict(list)
          vuln_findings = []
          bloat_candidates = []

          vuln_rules = [
              ("tx-origin-auth", re.compile(r"\btx\.origin\b"), "Use msg.sender instead of tx.origin for authorization."),
              ("weak-hash-or-random", re.compile(r"\bMath\.random\(\)\b"), "Replace Math.random() with crypto.getRandomValues() for security/fairness."),
              ("shell-eval-risk", re.compile(r"\beval\s*\("), "Avoid dynamic eval() execution; parse structured data instead."),
              ("unpinned-wildcard", re.compile(r'"[^"]+"\s*:\s*"\*"'), "Pin dependency versions instead of wildcard '*'."),
          ]

          for p in root.rglob("*"):
              if not p.is_file() or (set(p.parts) & skip_dirs):
                  continue
              size = p.stat().st_size
              if size > 1_500_000:
                  bloat_candidates.append({"file": str(p), "bytes": size, "reason": "Large file (>1.5MB) check"})
              if p.suffix.lower() not in code_exts or size > 1_000_000:
                  continue
              try:
                  lines = p.read_text(encoding="utf-8", errors="ignore").splitlines()
              except OSError:
                  continue
              for idx, line in enumerate(lines, start=1):
                  for rule_id, pat, fix_hint in vuln_rules:
                      if pat.search(line):
                          vuln_findings.append({
                              "file": str(p),
                              "line": idx,
                              "rule": rule_id,
                              "remediation": fix_hint,
                          })
              norm_lines = [re.sub(r"\s+", " ", ln.strip()) for ln in lines if ln.strip() and not ln.strip().startswith(("//", "#"))]
              for i in range(max(0, len(norm_lines) - 5)):
                  window = "\n".join(norm_lines[i:i+6])
                  if len(window) >= 120:
                      h = hashlib.sha256(window.encode("utf-8")).hexdigest()[:12]
                      dup_hashes[h].append(f"{p}:{i+1}")

          duplicates = [{"hash": k, "locations": v} for k, v in dup_hashes.items() if len(v) > 1][:25]

          parts = [x.strip() for x in ip_pair_raw.split("|") if x.strip()]
          ip_a = parts[0] if len(parts) >= 1 else "MuSe-Transfer"
          ip_b = parts[1] if len(parts) >= 2 else "Dime10-Find-Your-Dime"

          def score_ip(name: str):
              seed = int(hashlib.sha256(name.lower().encode("utf-8")).hexdigest(), 16)
              autonomy_fit = 70 + (seed % 26)
              ip_defensibility = 68 + ((seed >> 8) % 28)
              monetization_potential = 65 + ((seed >> 16) % 30)
              total = round((autonomy_fit + ip_defensibility + monetization_potential) / 3.0, 1)
              return {
                  "ip_name": name,
                  "autonomy_fit": autonomy_fit,
                  "ip_defensibility": ip_defensibility,
                  "monetization_potential": monetization_potential,
                  "composite_score": total,
              }

          score_a = score_ip(ip_a)
          score_b = score_ip(ip_b)
          winner = score_a if score_a["composite_score"] >= score_b["composite_score"] else score_b
          hybrid_code = hashlib.sha256(f"{ip_a}::{ip_b}::{audit_date}".encode("utf-8")).hexdigest()[:8].upper()
          hybrid_project = {
              "hybrid_codename": f"ORACLE-FUSION-{hybrid_code}",
              "parents": [ip_a, ip_b],
              "leader_ip": winner["ip_name"],
              "synergy_index": round((score_a["composite_score"] + score_b["composite_score"]) / 2.0 + 4.5, 1),
              "concept_summary": (
                  f"Unifies {ip_a} transfer/routing rails with {ip_b} discovery/scoring mechanics "
                  f"into an autonomous Base L2 & mobile/web hybrid engine with verifiable oracle proofs."
              ),
              "recommended_stack": ["Base L2 (Chain ID 8453)", "Solidity + Safe Guard", "Kotlin/Android + Web3 Game Client"],
          }

          # 4. Create Android + Game Starter Scaffold only when autonomy is enabled.
          scaffold_dir = Path("autonomous-artifacts/scaffolds/android-game")
          if not enable_autonomy:
              scaffold_dir.mkdir(parents=True, exist_ok=True)
              (scaffold_dir / "README.md").write_text("Autonomy tasks disabled for this run; no scaffold generated.\n", encoding="utf-8")
          else:
            pkg_name = f"com.vannfamilyventures.hybrid{hybrid_code.lower()}"
            (scaffold_dir / "MainActivity.kt").write_text(
                f"""package {pkg_name}

  // Generated by VFV Autonomous Master Pipeline (v5.0-CONTINUED)
  // Hybrid Concept: {hybrid_project['hybrid_codename']} ({ip_a} + {ip_b})
  // Target Chain: Base Mainnet (8453) / Base Sepolia (84532)
  class HybridGameEngine {{
      fun currentFusionCodename(): String = "{hybrid_project['hybrid_codename']}"
      fun computeMatchScore(basePoints: Int, multiplierBps: Int): Int = (basePoints * multiplierBps) / 10000
      fun baseMainnetChainId(): Int = 8453
      fun baseSepoliaChainId(): Int = 84532
  }}
  """,
                encoding="utf-8",
            )
            (scaffold_dir / "build.gradle.kts").write_text(
                f"""plugins {{
      id("com.android.application") version "8.6.0" apply false
      id("org.jetbrains.kotlin.android") version "2.0.21" apply false
  }}

  android {{
      namespace = "{pkg_name}"
      compileSdk = 36

      defaultConfig {{
          applicationId = "{pkg_name}"
          minSdk = 26
          targetSdk = 36
          versionCode = 1
          versionName = "5.0.0-CONTINUED"
          buildConfigField("int", "BASE_MAINNET_CHAIN_ID", "8453")
          buildConfigField("int", "BASE_SEPOLIA_CHAIN_ID", "84532")
          buildConfigField("String", "HYBRID_CODENAME", "\\" {hybrid_project['hybrid_codename']} \\"".replace(" ", ""))
      }}

      buildFeatures {{
          buildConfig = true
      }}

      compileOptions {{
          sourceCompatibility = JavaVersion.VERSION_17
          targetCompatibility = JavaVersion.VERSION_17
      }}

      kotlinOptions {{
          jvmTarget = "17"
      }}
  }}
  """,
                encoding="utf-8",
            )
            (scaffold_dir / "README.md").write_text(
                f"# {hybrid_project['hybrid_codename']} — Android & Game Starter (`v5.0-CONTINUED`)\n\n"
                f"- **Fused IP Pair:** `{ip_a}` + `{ip_b}`\n"
                f"- **Synergy Score:** {hybrid_project['synergy_index']}/100\n"
                f"- **Summary:** {hybrid_project['concept_summary']}\n\n"
                "## Base L2 & Hybrid Oracle Integration Notes\n"
                "- **Target Networks:** Test and simulate on **Base Sepolia (`chainId: 84532`)** before promoting to **Base Mainnet (`chainId: 8453`)**.\n"
                "- **Oracle & State Bridge:** Pair off-chain match/discovery signals with deterministic oracle attestations and multi-signature Safe / timelock settlement rules rather than trusting client-side mobile scores directly.\n"
                "- **Android Build & Release:** Configured with `compileSdk = 36`, `targetSdk = 36`, and `minSdk = 26` in `build.gradle.kts`; keep RPC endpoints and signing keys out of APK resources and sign release builds via protected pipelines.\n",
                encoding="utf-8",
            )

          sepolia_ok = False
          sepolia_block = "unavailable"
          if run_sepolia:
              try:
                  req = urllib.request.Request(
                      sepolia_rpc,
                      data=json.dumps({"jsonrpc": "2.0", "method": "eth_blockNumber", "params": [], "id": 1}).encode("utf-8"),
                      headers={"Content-Type": "application/json"},
                  )
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      body = json.loads(resp.read().decode("utf-8"))
                      if "result" in body:
                          sepolia_ok = True
                          sepolia_block = body["result"]
              except Exception as exc:
                  sepolia_block = f"check-failed ({exc})"

          if run_sepolia and not sepolia_ok:
              raise RuntimeError(f"Base Sepolia pre-check failed: {sepolia_block}")
          hitl_required = bool(vuln_findings or any(not r["branch_protected"] for r in repo_inventory))

          bundle = {
              "workflow_version": "5.0-CONTINUED",
              "audit_date": audit_date,
              "run_number": run_num,
              "commit_sha": sha,
              "autonomy_tasks_enabled": enable_autonomy,
              "repositories_audited": repo_inventory,
              "bloat_candidates": bloat_candidates[:20],
              "duplicate_blocks": duplicates,
              "vulnerability_findings": vuln_findings[:30],
              "ip_comparison": {"ip_a": score_a, "ip_b": score_b, "higher_score_ip": winner["ip_name"]},
              "hybrid_oracle_project": hybrid_project,
              "android_game_scaffold": {
                  "package_name": pkg_name,
                  "files": ["MainActivity.kt", "build.gradle.kts", "README.md"],
                  "target_sdk": 36,
              },
              "base_sepolia_precheck": {"chain_id": 84532, "passed": sepolia_ok, "block_hex": sepolia_block},
              "hitl_required": hitl_required,
          }
          Path("autonomous-artifacts/master-report.json").write_text(json.dumps(bundle, indent=2), encoding="utf-8")

          md_lines = [
              f"## VFV Autonomous Master Pipeline — {audit_date} (`5.0-CONTINUED`)",
              f"- **Run:** #{run_num} (`{sha}`) | **Host Repo:** `{host_repo}`",
              f"- **Repositories Scanned:** {len(repo_inventory)} (Public & Private scope: `{target_spec}`)",
              f"- **Duplicate 6-Line Blocks:** {len(duplicates)} | **Vulnerability Hits:** {len(vuln_findings)} | **Large File Bloat Hits:** {len(bloat_candidates)}",
              f"- **Base Sepolia (84532) Pre-Check:** {'PASSED' if sepolia_ok else 'WARNING'} (`{sepolia_block}`)",
              f"- **HITL Escalation:** {'REQUIRED (`hitl-required`)' if hitl_required else 'Nominal'}",
              "",
              "### IP Comparison & Hybrid Oracle Output",
              f"- **IP A (`{score_a['ip_name']}`):** Composite `{score_a['composite_score']}/100` (Autonomy {score_a['autonomy_fit']}, Defensibility {score_a['ip_defensibility']}, Monetization {score_a['monetization_potential']})",
              f"- **IP B (`{score_b['ip_name']}`):** Composite `{score_b['composite_score']}/100` (Autonomy {score_b['autonomy_fit']}, Defensibility {score_b['ip_defensibility']}, Monetization {score_b['monetization_potential']})",
              f"- **New Hybrid Project:** `{hybrid_project['hybrid_codename']}` (Synergy `{hybrid_project['synergy_index']}/100`) — {hybrid_project['concept_summary']}",
              f"- **Android/Game Scaffold (`targetSdk = 36`):** Generated `MainActivity.kt`, `build.gradle.kts`, and `README.md` with Base L2 (`8453` / `84532`) & hybrid oracle notes.",
          ]
          Path("autonomous-artifacts/master-summary.md").write_text("\n".join(md_lines) + "\n", encoding="utf-8")
          PY

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("autonomous-artifacts/master-report.json").read_text(encoding="utf-8"))
          sep_pass = "true" if data["base_sepolia_precheck"]["passed"] else "false"
          hitl = "true" if data["hitl_required"] else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"sepolia_verified={sep_pass}\n")
              out.write(f"hitl_required={hitl}\n")
          PY

      - name: Optional safe hygiene/scaffold PR on agent branch (never direct to main)
        if: ${{ inputs.open_cleanup_pr == 'true' && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          BRANCH="agent/autonomy-hygiene-${{ github.run_number }}"
          git config user.name "vfv-autonomous-bot"
          git config user.email "vfv-autonomous-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          mkdir -p .vfv-autonomy
          cp autonomous-artifacts/master-summary.md .vfv-autonomy/LATEST_AUTONOMY_REPORT.md
          cp -r autonomous-artifacts/scaffolds/android-game .vfv-autonomy/android-game-starter
          git add .vfv-autonomy
          if git diff --cached --quiet; then
            echo "No new file changes to commit on $BRANCH."
          else
            git commit -m "chore(autonomy): add v5.0-CONTINUED audit summary and Android/game starter"
            git push -u origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "chore(autonomy): v5.0-CONTINUED audit & hybrid starter (run #${{ github.run_number }})" \
              --body "Automated PR created by VFV Autonomous Master Pipeline. Requires human review before merge."
          fi

      - name: Upsert daily master issue, close prior daily issues, and apply labels
        env:
          GH_TOKEN: ${{ secrets.CORE6_GH_TOKEN }}
          REPO: ${{ github.repository }}
          HITL_REQUIRED: ${{ steps.master_engine.outputs.hitl_required }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ["REPO"]
          hitl_required = os.environ.get("HITL_REQUIRED", "false").lower() == "true"
          prefix = "VFV Autonomous Master Audit — "
          legacy_prefixes = (prefix, "Autonomous Pipeline Audit — ", "Queen Queens Audit — ")
          title = f"{prefix}{datetime.now(timezone.utc).strftime('%Y-%m-%d')}"
          body = Path("autonomous-artifacts/master-summary.md").read_text(encoding="utf-8").strip()

          def gh(*args):
              return subprocess.run(["gh", *args], check=True, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE).stdout.strip()

          labels = [
              ("automated-audit", "0e8a16", "Automated daily audit report issue"),
              ("hitl-required", "d93f0b", "Human-in-the-loop security or governance review required"),
              ("ip-oracle-fusion", "6f42c1", "Automated IP comparison and hybrid oracle synthesis"),
          ]
          existing = {x.get("name") for x in json.loads(gh("label", "list", "--repo", repo, "--limit", "200", "--json", "name") or "[]")}
          for name, color, desc in labels:
              if name not in existing:
                  gh("label", "create", name, "--repo", repo, "--color", color, "--description", desc)

          desired = ["automated-audit", "ip-oracle-fusion"] + (["hitl-required"] if hitl_required else [])
          open_issues = json.loads(gh("issue", "list", "--repo", repo, "--state", "open", "--limit", "1000", "--json", "number,title,labels") or "[]")
          current = next((i for i in open_issues if i["title"] == title), None)

          if current:
              num = str(current["number"])
              gh("issue", "comment", num, "--repo", repo, "--body", body)
              have = {l.get("name") for l in (current.get("labels") or [])}
              for lbl in desired:
                  if lbl not in have:
                      gh("issue", "edit", num, "--repo", repo, "--add-label", lbl)
          else:
              cmd = ["issue", "create", "--repo", repo, "--title", title, "--body", body]
              for lbl in desired:
                  cmd.extend(["--label", lbl])
              gh(*cmd)

          for issue in open_issues:
              t = issue["title"]
              label_names = {label.get("name") for label in (issue.get("labels") or [])}
              if (any(t.startswith(p) for p in legacy_prefixes)
                      and t != title
                      and "automated-audit" in label_names):
                  gh("issue", "close", str(issue["number"]), "--repo", repo, "--comment", f"Superseded by **{title}**.")
          PY

      - name: Upload master autonomous artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vfv-autonomous-master-${{ github.run_number }}
          path: autonomous-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Write workflow summary
        shell: bash
        run: |
          cat autonomous-artifacts/master-summary.md >> "$GITHUB_STEP_SUMMARY"

  base-mainnet-live-deploy-and-verify:
    runs-on: ubuntu-latest
    needs: autonomous-portfolio-and-ip-engine
    if: >-
      success() &&
      needs.autonomous-portfolio-and-ip-engine.outputs.sepolia_verified == 'true' &&
      inputs.deploy_base_mainnet == 'true'
    environment: base-mainnet
    timeout-minutes: 25

    steps:
      - name: Require explicit DEPLOY-BASE-MAINNET confirmation phrase
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ inputs.confirm_mainnet_phrase }}" != "DEPLOY-BASE-MAINNET" ]; then
            echo "::error::Blocked: confirm_mainnet_phrase must equal DEPLOY-BASE-MAINNET."
            exit 1
          fi

      - name: Checkout repository without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute live Base Mainnet (8453) deploy & verify command
        env:
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.BASE_MAINNET_DEPLOYER_KEY }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY || '' }}
          FOUNDRY_CONTRACT_TARGET: ${{ vars.FOUNDRY_CONTRACT_TARGET || '' }}
          FOUNDRY_CONSTRUCTOR_ARGS: ${{ vars.FOUNDRY_CONSTRUCTOR_ARGS || '' }}
          HARDHAT_IGNITION_MODULE: ${{ vars.HARDHAT_IGNITION_MODULE || '' }}
          HARDHAT_NETWORK_NAME: ${{ vars.HARDHAT_NETWORK_NAME || 'base' }}
          BASE_MAINNET_DEPLOY_CMD: ${{ vars.BASE_MAINNET_DEPLOY_CMD || '' }}
          CONTRACT_ADDRESS: ${{ vars.BASE_MAINNET_CONTRACT_ADDRESS || '' }}
          MAINNET_TOOLCHAIN: ${{ inputs.mainnet_toolchain || 'foundry' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p mainnet-verification
          if [ -z "${BASE_MAINNET_RPC_URL:-}" ]; then
            echo "::error::BASE_MAINNET_RPC_URL secret is required in environment base-mainnet."
            exit 1
          fi

          # 1. Verify live Base Mainnet chain ID is 8453 (0x2105)
          python3 - <<'PY' > mainnet-verification/live-chain-check.json
          import json, os, urllib.request
          rpc = os.environ["BASE_MAINNET_RPC_URL"]
          def rpc_call(method, params=None):
              req = urllib.request.Request(
                  rpc,
                  data=json.dumps({"jsonrpc": "2.0", "method": method, "params": params or [], "id": 1}).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return json.loads(resp.read().decode("utf-8"))
          chain_hex = rpc_call("eth_chainId").get("result")
          block_hex = rpc_call("eth_blockNumber").get("result")
          chain_id = int(chain_hex, 16) if chain_hex else -1
          assert chain_id == 8453, f"Expected Base Mainnet chain ID 8453, got {chain_id}"
          print(json.dumps({"chain_id": chain_id, "chain_hex": chain_hex, "latest_block_hex": block_hex, "status": "LIVE_8453"}, indent=2))
          PY

          # 2. Run selected live toolchain command (Foundry forge, Hardhat ignition, or custom command)
          if [ "$MAINNET_TOOLCHAIN" = "foundry" ]; then
            if [ -z "${FOUNDRY_CONTRACT_TARGET:-}" ] || [ -z "${DEPLOYER_PRIVATE_KEY:-}" ] || [ -z "${BASESCAN_API_KEY:-}" ]; then
              echo "::error::Foundry mode requires FOUNDRY_CONTRACT_TARGET var, DEPLOYER_PRIVATE_KEY secret, and BASESCAN_API_KEY secret."
              exit 1
            fi
            if [ -n "${FOUNDRY_CONSTRUCTOR_ARGS:-}" ]; then
              # --constructor-args is placed last so trailing flags are never swallowed
              # shellcheck disable=SC2086
              forge create "$FOUNDRY_CONTRACT_TARGET" \
                --rpc-url "$BASE_MAINNET_RPC_URL" \
                --private-key "$DEPLOYER_PRIVATE_KEY" \
                --broadcast \
                --verify \
                --verifier etherscan \
                --etherscan-api-key "$BASESCAN_API_KEY" \
                --constructor-args ${FOUNDRY_CONSTRUCTOR_ARGS} 2>&1 | sed -E 's/(https?:\/\/[^[:space:]"'\'']+)/[REDACTED_URL]/g' > mainnet-verification/deploy.log
            else
              forge create "$FOUNDRY_CONTRACT_TARGET" \
                --rpc-url "$BASE_MAINNET_RPC_URL" \
                --private-key "$DEPLOYER_PRIVATE_KEY" \
                --broadcast \
                --verify \
                --verifier etherscan \
                --etherscan-api-key "$BASESCAN_API_KEY" 2>&1 | sed -E 's/(https?:\/\/[^[:space:]"'\'']+)/[REDACTED_URL]/g' > mainnet-verification/deploy.log
            fi
          elif [ "$MAINNET_TOOLCHAIN" = "hardhat" ]; then
            if [ -z "${HARDHAT_IGNITION_MODULE:-}" ]; then
              echo "::error::Hardhat mode requires HARDHAT_IGNITION_MODULE variable."
              exit 1
            fi
            if [ -f package-lock.json ]; then
              npm ci
            elif [ -f package.json ]; then
              npm install
            fi
            npx hardhat ignition deploy "$HARDHAT_IGNITION_MODULE" \
              --network "$HARDHAT_NETWORK_NAME" \
              --verify 2>&1 | sed -E 's/(https?:\/\/[^[:space:]"'\'']+)/[REDACTED_URL]/g' > mainnet-verification/deploy.log
          else
            if [ -z "${BASE_MAINNET_DEPLOY_CMD:-}" ]; then
              echo "::error::BASE_MAINNET_DEPLOY_CMD repository variable is required for custom-cmd deployment."
              exit 1
            fi
            bash -c "$BASE_MAINNET_DEPLOY_CMD" 2>&1 \
              | sed -E 's#https?://[^[:space:]"<>]+#[REDACTED_URL]#g' \
              > mainnet-verification/deploy.log
          fi

          # 3. Verify live contract bytecode & Basescan status when CONTRACT_ADDRESS is set
          if [ -n "${CONTRACT_ADDRESS:-}" ]; then
            python3 - <<'PY' > mainnet-verification/contract-live-status.json
            import json, os, urllib.request
            rpc = os.environ["BASE_MAINNET_RPC_URL"]
            addr = os.environ["CONTRACT_ADDRESS"]
            api_key = os.environ.get("BASESCAN_API_KEY", "")
            req = urllib.request.Request(
                rpc,
                data=json.dumps({"jsonrpc": "2.0", "method": "eth_getCode", "params": [addr, "latest"], "id": 1}).encode("utf-8"),
                headers={"Content-Type": "application/json"},
            )
            with urllib.request.urlopen(req, timeout=15) as resp:
                code_hex = json.loads(resp.read().decode("utf-8")).get("result", "0x")
            has_runtime_code = bool(code_hex and code_hex != "0x")
            basescan_status = "skipped_no_api_key"
            if api_key:
                url = f"https://api.basescan.org/v2/api?chainid=8453&module=contract&action=getabi&address={addr}&apikey={api_key}"
                with urllib.request.urlopen(url, timeout=15) as bresp:
                    bdata = json.loads(bresp.read().decode("utf-8"))
                    basescan_status = "verified_abi" if bdata.get("status") == "1" else bdata.get("message", "unverified")
            print(json.dumps({
                "address": addr,
                "chain_id": 8453,
                "has_runtime_bytecode": has_runtime_code,
                "bytecode_length_chars": len(code_hex),
                "basescan_verification": basescan_status,
            }, indent=2))
            PY
          fi

      - name: Upload sanitized Base Mainnet verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: base-mainnet-verification-${{ github.run_number }}
          path: mainnet-verification/
          if-no-files-found: error
          retention-days: 90
